spring.application.name=armazem

# Banco: a aplicacao conecta sempre como armazem_app (so DML), nunca como root.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:armazem}?connectionTimeZone=America/Sao_Paulo
spring.datasource.username=${DB_USER:armazem_app}
spring.datasource.password=${DB_PASSWORD:}
# READ COMMITTED: depois de travar o compartimento (FOR UPDATE), as leituras seguintes veem o saldo mais recente.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# O schema e criado pelos scripts em docker/mysql/init; o Hibernate nao altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

armazem.fuso-horario=America/Sao_Paulo

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

springdoc.swagger-ui.path=/swagger-ui.html
