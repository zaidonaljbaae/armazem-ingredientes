# Perfil "test": H2 em memoria no modo MySQL. Cada contexto Spring ganha um banco proprio.
spring.datasource.url=jdbc:h2:mem:armazem-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
